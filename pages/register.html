<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Product Dashboard</title>
  <link rel="stylesheet" href="../style/auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="brand">Product Admin</div>
      <h1>Create account</h1>
      <p class="subtitle">Create an account for the admin area.</p>

      <form id="registerForm" class="auth-form">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Register</button>
        <p id="message" class="form-message"></p>
      </form>

      <p class="auth-footer">Already have an account? <a href="/pages/login.html">Login</a></p>
    </section>
  </main>
  <script src="../script/register.js"></script>
</body>
</html>
