<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Product Dashboard</title>
  <link rel="stylesheet" href="../style/auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="brand">Product Admin</div>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to continue to the dashboard.</p>

      <form id="loginForm" class="auth-form">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Login</button>
        <p id="message" class="form-message"></p>
      </form>

      <p class="auth-footer">Don't have an account? <a href="/pages/register.html">Register</a></p>
    </section>
  </main>
  <script src="../script/login.js"></script>
</body>
</html>
